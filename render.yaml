databases:
  - name: investment-exchange-db
    plan: free
    databaseName: investment_exchange
    user: investment_user

services:
  - type: web
    name: investment-exchange
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: investment-exchange-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
