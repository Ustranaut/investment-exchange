{% extends "base.html" %}
{% block title %}Вход — InvestSim{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Вход в систему</h1>
        {% if form.errors %}<div class="alert alert-danger">Проверьте логин и пароль.</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Логин</label>
            <input class="form-control" type="text" name="username" id="id_username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Пароль</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
